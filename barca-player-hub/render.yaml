services:
  - type: web
    name: barca-player-hub
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BARCA_TEAM_ID
        value: 529
      - key: SEASON
        value: 2026
      - key: APISPORTS_KEY
        sync: false
