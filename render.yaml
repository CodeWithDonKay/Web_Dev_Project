services:
  - type: web
    name: barca-player-hub
    runtime: node
    plan: free
    buildCommand: rm -rf barca-player-hub && unzip -q barca-player-hub-site-v2.zip
    startCommand: cd barca-player-hub && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BARCA_TEAM_ID
        value: 529
      - key: SEASON
        value: 2026
      - key: APISPORTS_KEY
        sync: false
